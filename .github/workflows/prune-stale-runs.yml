name: One-time prune stale workflow runs

on:
  push:
    paths:
      - ".github/workflows/prune-stale-runs.yml"

permissions:
  contents: write
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete runs for unreachable commits
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-list HEAD > /tmp/reachable

          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .head_sha] | @tsv' > /tmp/runs

          while IFS=$'\t' read -r run_id head_sha; do
            [ -n "$run_id" ] || continue
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            if ! grep -qx "$head_sha" /tmp/reachable; then
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
            fi
          done < /tmp/runs

      - name: Remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "abr797"
          git config user.email "326879900+abr797@users.noreply.github.com"
          git rm .github/workflows/prune-stale-runs.yml
          git commit -m "Remove one-time workflow run cleanup"
          git push origin HEAD:main
