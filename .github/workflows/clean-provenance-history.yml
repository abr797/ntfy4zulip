name: One-time clean provenance history

on:
  push:
    paths:
      - ".github/workflows/clean-provenance-history.yml"

permissions:
  contents: write
  actions: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve clean implementations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/clean/ntfy4zulip /tmp/clean/testing /tmp/clean/systemd
          cp ntfy4zulip/links.py /tmp/clean/ntfy4zulip/links.py
          cp testing/mock_ntfy_server.py /tmp/clean/testing/mock_ntfy_server.py
          cp systemd/ntfy4zulip-db.service /tmp/clean/systemd/ntfy4zulip-db.service

      - name: Rewrite reachable history
        shell: bash
        run: |
          set -euo pipefail
          export FILTER_BRANCH_SQUELCH_WARNING=1
          export CLEAN_EMAIL="326879900+abr797@users.noreply.github.com"

          git filter-branch -f \
            --tree-filter '
              if [ -f ntfy4zulip/links.py ]; then
                cp /tmp/clean/ntfy4zulip/links.py ntfy4zulip/links.py
              fi
              if [ -f testing/mock_ntfy_server.py ]; then
                cp /tmp/clean/testing/mock_ntfy_server.py testing/mock_ntfy_server.py
              fi
              if [ -f systemd/ntfy4zulip-db.service ]; then
                cp /tmp/clean/systemd/ntfy4zulip-db.service systemd/ntfy4zulip-db.service
              fi
            ' \
            --env-filter '
              case "$GIT_AUTHOR_EMAIL" in
                *@users.noreply.github.com|noreply@github.com) ;;
                *) export GIT_AUTHOR_EMAIL="$CLEAN_EMAIL" ;;
              esac
              case "$GIT_COMMITTER_EMAIL" in
                *@users.noreply.github.com|noreply@github.com) ;;
                *) export GIT_COMMITTER_EMAIL="$CLEAN_EMAIL" ;;
              esac
            ' \
            -- main

      - name: Verify rewritten tip
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m unittest discover -s tests -v
          python -m compileall -q ntfy4zulip run_db.py testing/mock_ntfy_server.py
          ruff check ntfy4zulip tests run_db.py testing/mock_ntfy_server.py

      - name: Remove one-time workflow and publish rewritten history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "abr797"
          git config user.email "326879900+abr797@users.noreply.github.com"
          git rm .github/workflows/clean-provenance-history.yml
          git commit -m "Remove one-time provenance cleanup workflow"
          git push --force origin HEAD:main
